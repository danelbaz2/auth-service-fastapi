version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pgsql
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth-service:
    build: .
    container_name: auth-service
    depends_on:
      - db
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: bash -c "uv run python check_db.py && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db_data:
